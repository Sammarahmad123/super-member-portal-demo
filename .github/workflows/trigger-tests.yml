# Triggers the automation repo to run Playwright tests whenever a PR
# targeting main is opened or updated. Also runnable manually from the
# Actions tab.
name: Trigger Playwright Tests

on:
  pull_request:
    branches: [main]

  # Also allow a manual kick-off from the Actions tab.
  workflow_dispatch:

jobs:
  trigger-automation:
    name: Dispatch test run to memberPortalAutomation
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch app-updated event to automation repo
        run: |
          curl -f -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sammarahmad123/memberPortalAutomation/dispatches \
            --data '{
              "event_type": "app-updated",
              "client_payload": {
                "app_url": "https://sammarahmad123.github.io/super-member-portal-demo/"
              }
            }'

      - name: Log automation run location
        run: |
          echo "✅ Test run dispatched successfully."
          echo "   Watch progress at:"
          echo "   https://github.com/Sammarahmad123/memberPortalAutomation/actions"
