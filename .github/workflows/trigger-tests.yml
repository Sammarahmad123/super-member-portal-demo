# Waits for GitHub Pages ("pages-build-deployment") to finish before
# dispatching tests.  This guarantees the automation repo always runs
# against the freshly-deployed app, never a stale or mid-deploy version.
name: Trigger Playwright Tests

on:
  # Fire only after the built-in GitHub Pages deployment workflow completes.
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]

  # Also allow a manual kick-off from the Actions tab.
  workflow_dispatch:

jobs:
  trigger-automation:
    name: Dispatch test run to memberPortalAutomation
    runs-on: ubuntu-latest

    # For workflow_run: skip if the Pages deployment failed or was cancelled.
    # workflow_dispatch has no workflow_run context, so the condition is skipped
    # and the job always runs when triggered manually.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Dispatch app-updated event to automation repo
        run: |
          curl -f -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sammarahmad123/memberPortalAutomation/dispatches \
            --data '{
              "event_type": "app-updated",
              "client_payload": {
                "app_url": "https://sammarahmad123.github.io/super-member-portal-demo/"
              }
            }'

      - name: Log automation run location
        run: |
          echo "✅ Test run dispatched successfully."
          echo "   Watch progress at:"
          echo "   https://github.com/Sammarahmad123/memberPortalAutomation/actions"
